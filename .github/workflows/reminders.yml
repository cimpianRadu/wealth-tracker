# Reminderele pentru extrase: o dată pe zi, la 08:17 ora României (06:17 UTC iarna).
# Endpoint-ul e idempotent (un email pe membru, lună și fel), deci nu are nevoie de secret.
name: Reminder extrase

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Apelează /api/cron/reminders
        run: curl -fsS "https://wealthtracker.ro/api/cron/reminders"
